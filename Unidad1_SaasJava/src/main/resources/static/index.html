<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editor de Texto SaaS</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    textarea { width: 100%; height: 250px; font-size: 16px; }
    input { width: 100%; padding: 8px; margin-bottom: 10px; }
    button { padding: 8px 16px; margin-top: 10px; }
    #lista { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
    .tarjeta { display: flex; flex-direction: column; min-height: 190px; padding: 20px; border: 1px solid #dee2e6; border-radius: 8px; box-shadow: 0 2px 6px rgba(0, 0, 0, .12); background: #fff; }
    .tarjeta h3 { margin: 0 0 12px; }
    .tarjeta p { flex-grow: 1; margin: 0; color: #495057; white-space: pre-wrap; }
    .acciones { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .acciones button { margin: 0; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    .btn-editar { background: #198754; }
    .btn-eliminar { background: #dc3545; }
  </style>
</head>
<body>
  <h1>Editor de Texto SaaS</h1>
 
  <input id="titulo" placeholder="Título del documento">
  <textarea id="contenido" placeholder="Escribe aquí..."></textarea>
  <br>
  <button onclick="guardarDocumento()">Guardar</button>
 
  <h2>Documentos guardados</h2>
  <div id="lista"></div>
 
  <script>
    const API = '/api/documentos';
    let idActual = null;
 
    async function cargarLista() {
      const res = await fetch(API);
      const documentos = await res.json();
      const lista = document.getElementById('lista');
      lista.innerHTML = '';
      documentos.forEach(doc => {
        const tarjeta = document.createElement('article');
        tarjeta.className = 'tarjeta';

        const titulo = document.createElement('h3');
        titulo.textContent = doc.titulo;

        const descripcion = document.createElement('p');
        descripcion.textContent = doc.contenido;

        const acciones = document.createElement('div');
        acciones.className = 'acciones';

        const botonEditar = document.createElement('button');
        botonEditar.textContent = 'Editar';
        botonEditar.className = 'btn-editar';
        botonEditar.onclick = () => cargarDocumento(doc);

        const botonEliminar = document.createElement('button');
        botonEliminar.textContent = 'Eliminar';
        botonEliminar.className = 'btn-eliminar';
        botonEliminar.onclick = (event) => eliminarDocumento(doc.id, event);

        acciones.appendChild(botonEditar);
        acciones.appendChild(botonEliminar);
        tarjeta.appendChild(titulo);
        tarjeta.appendChild(descripcion);
        tarjeta.appendChild(acciones);
        lista.appendChild(tarjeta);
      });
    }

    async function eliminarDocumento(id, event) {
      event.stopPropagation();
      if (!confirm('¿Eliminar este documento?')) return;

      await fetch(`${API}/${id}`, { method: 'DELETE' });
      if (idActual === id) {
        idActual = null;
        document.getElementById('titulo').value = '';
        document.getElementById('contenido').value = '';
      }
      cargarLista();
    }
 
    function cargarDocumento(doc) {
      idActual = doc.id;
      document.getElementById('titulo').value = doc.titulo;
      document.getElementById('contenido').value = doc.contenido;
    }
 
    async function guardarDocumento() {
      const titulo = document.getElementById('titulo').value;
      const contenido = document.getElementById('contenido').value;
      const doc = { titulo, contenido, autor: 'Alumno' };
 
      if (idActual) {
        await fetch(`${API}/${idActual}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(doc)
        });
      } else {
        await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(doc)
        });
      }
      idActual = null;
      document.getElementById('titulo').value = '';
      document.getElementById('contenido').value = '';
      cargarLista();
    }
 
    cargarLista();
  </script>
</body>
</html>
