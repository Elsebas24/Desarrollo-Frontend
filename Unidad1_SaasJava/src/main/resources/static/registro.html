<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Editor de Texto SaaS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .password-field {
      position: relative;
    }

    .password-field .form-control {
      padding-right: 2.75rem;
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 0.4rem;
      z-index: 3;
      width: 2rem;
      height: 2rem;
      padding: 0;
      border: 0;
      background: transparent;
      color: #6c757d;
      transform: translateY(-50%);
    }

    .password-toggle:hover,
    .password-toggle:focus {
      color: #212529;
      outline: none;
    }
  </style>
</head>

<body class="bg-light">
  <main class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-sm" style="width: 100%; max-width: 400px;">
      <div class="card-body p-4">
        <h1 class="h3 mb-4 text-center">Crear cuenta</h1>

        <div id="alerta"></div>

        <form onsubmit="registrar(event)">
          <div class="mb-3">
            <label for="username" class="form-label">Usuario</label>
            <input type="text" id="username" class="form-control" minlength="3" maxlength="50" required autofocus>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <div class="password-field">
              <input type="password" id="password" class="form-control" minlength="6" required>
              <button type="button" class="password-toggle" onclick="togglePassword('password', this)"
                aria-label="Mostrar contraseña" title="Mostrar contraseña">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>
          <div class="mb-3">
            <label for="confirmar" class="form-label">Confirmar contraseña</label>
            <div class="password-field">
              <input type="password" id="confirmar" class="form-control" minlength="6" required>
              <button type="button" class="password-toggle" onclick="togglePassword('confirmar', this)"
                aria-label="Mostrar confirmación de contraseña" title="Mostrar confirmación de contraseña">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-success w-100">Registrarme</button>
        </form>

        <p class="text-center mt-3 mb-0">
          ¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a>
        </p>
      </div>
    </div>
  </main>
  <script>
    function leerCsrf() {
      const cookie = document.cookie.split('; ').find(c => c.startsWith('XSRF-TOKEN='));
      return cookie ? cookie.substring('XSRF-TOKEN='.length) : '';
    }

    function mostrarError(mensaje) {
      const div = document.createElement('div');
      div.className = 'alert alert-danger';
      div.textContent = mensaje;
      document.getElementById('alerta').replaceChildren(div);
    }

    function togglePassword(inputId, button) {
      const input = document.getElementById(inputId);
      const icon = button.querySelector('i');
      const isPassword = input.type === 'password';

      input.type = isPassword ? 'text' : 'password';
      icon.classList.toggle('fa-eye', !isPassword);
      icon.classList.toggle('fa-eye-slash', isPassword);
      button.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
      button.setAttribute('title', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
    }

    async function registrar(event) {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirmar = document.getElementById('confirmar').value;

      if (password !== confirmar) {
        mostrarError('Las contraseñas no coinciden');
        return;
      }

      try {
        const res = await fetch('/api/registro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-XSRF-TOKEN': leerCsrf() },
          body: JSON.stringify({ username, password })
        });

        if (res.ok) {
          location.href = '/login.html?registrado';
          return;
        }
        const data = await res.json().catch(() => ({}));
        mostrarError(data.mensaje || 'No se pudo registrar el usuario');
      } catch (error) {
        mostrarError('Error de conexión con el servidor');
      }
    }
  </script>
</body>

</html>
