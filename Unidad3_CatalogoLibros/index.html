<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Libros | Biblioteca FITEC</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<header class="topbar">
    <div class="container topbar-inner">
        <div>
            <h1>Catálogo de Libros</h1>
            <p class="subtitle">Acervo bibliográfico interactivo</p>
        </div>
        <button id="btnAbrirModal" class="btn btn-primary">+ Nuevo Libro</button>
    </div>
</header>

<main class="container">

    <section class="filters-bar" aria-label="Filtros del catálogo">
        <div class="filter-group grow">
            <label for="busqueda">Buscar</label>
            <input type="text" id="busqueda" placeholder="Título, autor o ISBN...">
        </div>

        <div class="filter-group">
            <label for="filtroCategoria">Categoría</label>
            <select id="filtroCategoria">
                <option value="Todas">Todas</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="filtroDisponible">Estado</label>
            <select id="filtroDisponible">
                <option value="">Todos</option>
                <option value="1">Disponibles</option>
                <option value="0">Prestados</option>
            </select>
        </div>

        <!-- Reto A: ordenamiento -->
        <div class="filter-group">
            <label for="filtroOrden">Ordenar por</label>
            <select id="filtroOrden">
                <option value="">Más recientes</option>
                <option value="anio_desc">Año (descendente)</option>
                <option value="titulo_asc">Título A–Z</option>
            </select>
        </div>
    </section>

    <div class="status-bar">
        <span id="contadorResultados">Cargando catálogo...</span>
        <!-- Reto C: exportar a CSV -->
        <button id="btnExportar" class="btn btn-secondary btn-sm">⬇ Exportar CSV</button>
    </div>

    <section id="catalogoGrid" class="books-grid" aria-live="polite"></section>

</main>

<!-- Modal Nuevo Libro -->
<div id="modalLibro" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Registrar Nuevo Libro</h2>
            <button class="btn-close" data-close="modalLibro">&times;</button>
        </div>

        <form id="formLibro">
            <div class="form-grid">
                <label>Título *<input type="text" name="titulo" required></label>
                <label>Autor *<input type="text" name="autor" required></label>
                <label>Categoría *<input type="text" name="categoria" required></label>
                <label>Año *<input type="number" name="anio_publicacion" min="1500" max="2030" required></label>
                <label>ISBN *<input type="text" name="isbn" required></label>
                <label>Editorial *<input type="text" name="editorial" required></label>
                <label>Páginas<input type="number" name="paginas" min="1" value="200"></label>
            </div>

            <label class="full-width">Sinopsis *
                <textarea name="sinopsis" rows="3" required></textarea>
            </label>

            <p id="errorForm" class="form-error hidden"></p>

            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" data-close="modalLibro">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar Libro</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Detalle -->
<div id="modalDetalle" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="detalleTitulo"></h2>
            <button class="btn-close" data-close="modalDetalle">&times;</button>
        </div>
        <p id="detalleMeta" class="detail-meta"></p>
        <p id="detalleSinopsis" class="detail-sinopsis"></p>
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
